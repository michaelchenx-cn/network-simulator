<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark light">
<script>/* 首帧前恢复主题，避免闪烁 */try{if(localStorage.getItem('ns.theme')==='light'){var h=document.documentElement;h.classList.add('light');h.style.colorScheme='light';}}catch(e){}</script>
<title>网络模拟器 | Network Simulator</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ───────── 顶部工具栏 ───────── -->
<header id="toolbar">
  <div class="tb-group" id="tb-logo">
    <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zM8.5 8.5h2v2h-2v-2zm5 0h2v2h-2v-2zM7 13.5c.9 2 2.7 3.2 5 3.2s4.1-1.2 5-3.2"/></svg>
    <span data-i18n="app.title">网络模拟器</span>
  </div>

  <div class="tb-group" id="tb-palette" data-i18n-title="tb.paletteTip">
    <button class="pal-btn" data-place="pc" data-i18n-title="dev.pc">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 20h8M12 16v4" stroke="currentColor" stroke-width="1.6"/></svg><span>PC</span>
    </button>
    <button class="pal-btn" data-place="router" data-i18n-title="dev.router">
      <svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M7 12h2m3 0h2m3 0h1" stroke="currentColor" stroke-width="1.6"/></svg><span data-i18n="dev.router">路由器</span>
    </button>
    <button class="pal-btn" data-place="switch" data-i18n-title="dev.switch">
      <svg viewBox="0 0 24 24"><rect x="3" y="9" width="18" height="6" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M6 12h3m3 0h3m3 0h1" stroke="currentColor" stroke-width="1.6"/></svg><span data-i18n="dev.switch">交换机</span>
    </button>
    <button class="pal-btn" data-place="server" data-i18n-title="dev.server">
      <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="6" rx="1" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="4" y="14" width="16" height="6" rx="1" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M7.5 7h.01M7.5 17h.01" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg><span data-i18n="dev.server">服务器</span>
    </button>
  </div>

  <div class="tb-group" id="tb-modes">
    <button id="btn-select" class="mode-btn active" data-i18n-title="tb.select">▾<span data-i18n="tb.selectLabel">选择</span></button>
    <button id="btn-link" class="mode-btn" data-i18n-title="tb.link">⇌<span data-i18n="tb.linkLabel">连线</span></button>
    <button id="btn-delete" class="mode-btn danger" data-i18n-title="tb.delete">✕<span data-i18n="tb.deleteLabel">删除</span></button>
  </div>

  <div class="tb-group" id="tb-sim">
    <button id="btn-run">▶</button>
    <button id="btn-step" data-i18n-title="tb.step">⏭</button>
    <select id="sel-speed" data-i18n-title="tb.speed">
      <option value="0.1">0.1×</option>
      <option value="0.5">0.5×</option>
      <option value="1" selected>1×</option>
      <option value="2">2×</option>
      <option value="5">5×</option>
      <option value="10">10×</option>
    </select>
    <span id="sim-clock" title="simulation time">0.0s</span>
  </div>

  <div class="tb-group" id="tb-file">
    <button id="btn-export" data-i18n="tb.export">导出</button>
    <button id="btn-import" data-i18n="tb.import">导入</button>
    <button id="btn-restore" data-i18n="tb.restore" disabled>恢复上一拓扑</button>
    <button id="btn-new" class="danger" data-i18n="tb.new">清空</button>
    <input type="file" id="file-import" accept=".json" hidden>
  </div>

  <div class="tb-spacer"></div>

  <div class="tb-group" id="tb-tools">
    <button id="btn-labs" data-i18n="tb.labs">实验</button>
    <button id="btn-theme" data-i18n-title="tb.theme">☀️</button>
    <button id="btn-lang">中 / EN</button>
    <button id="btn-help" data-i18n="tb.help">帮助</button>
  </div>
</header>

<!-- ───────── 主区域 ───────── -->
<div id="main">

  <!-- 实验侧栏 -->
  <aside id="labs-panel" class="collapsed">
    <div id="labs-list"></div>
  </aside>

  <!-- 画布 -->
  <div id="canvas-wrap">
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
          <circle cx="1.3" cy="1.3" r="1.3" fill="#172238"/>
        </pattern>
      </defs>
      <rect id="canvas-bg" x="0" y="0" width="4000" height="2600" fill="url(#grid)"/>
      <g id="g-links"></g>
      <g id="g-packets"></g>
      <g id="g-devices"></g>
    </svg>
    <div id="canvas-hint" data-i18n="canvas.hint">从上方工具栏选择设备，单击画布放置；双击设备打开终端；按住空白处拖动平移，滚轮缩放</div>
    <div id="canvas-zoom">
      <button id="zoom-in">＋</button>
      <button id="zoom-out">－</button>
      <button id="zoom-reset" data-i18n-title="tb.zoomReset">⌂</button>
    </div>
  </div>

  <!-- 属性面板 -->
  <aside id="inspector"><div id="inspector-body"></div></aside>
</div>

<!-- ───────── 底部面板 ───────── -->
<div id="bottom">
  <div id="bottom-tabs">
    <button class="btab active" data-tab="terminals" data-i18n="bt.terminals">终端</button>
    <button class="btab" data-tab="sniffer" data-i18n="bt.sniffer">抓包</button>
    <button class="btab" data-tab="log" data-i18n="bt.log">事件日志</button>
    <span class="btab-actions" id="tab-actions"></span>
  </div>
  <div id="bottom-body">
    <div id="pane-terminals" class="bpane active">
      <div id="terminal-tabs"></div>
      <div id="terminal-area"></div>
    </div>
    <div id="pane-sniffer" class="bpane">
      <div id="sniffer-bar">
        <label data-i18n="sn.capturePoint">捕获点</label>
        <select id="sn-point"></select>
        <label class="chk"><input type="checkbox" id="sn-arp" checked>ARP</label>
        <label class="chk"><input type="checkbox" id="sn-icmp" checked>ICMP</label>
        <label class="chk"><input type="checkbox" id="sn-tcp" checked>TCP</label>
        <button id="sn-clear" data-i18n="sn.clear">清空</button>
        <span id="sn-count" class="muted"></span>
      </div>
      <div id="sniffer-split">
        <div id="sniffer-table-wrap"><table id="sniffer-table"><thead>
          <tr><th>No.</th><th data-i18n="sn.time">时间</th><th data-i18n="sn.src">源地址</th><th data-i18n="sn.dst">目的地址</th><th data-i18n="sn.proto">协议</th><th data-i18n="sn.len">长度</th><th data-i18n="sn.info">信息</th></tr>
        </thead><tbody></tbody></table></div>
        <div id="sniffer-detail" class="muted" data-i18n="sn.detailHint">点击上方报文列表中的条目，查看逐层解码（以太网帧 → IP → TCP / ICMP / ARP）</div>
      </div>
    </div>
    <div id="pane-log" class="bpane"><div id="log-area"></div></div>
  </div>
</div>

<!-- 弹层：帮助 -->
<dialog id="modal-help" class="modal" aria-labelledby="help-title">
  <div class="modal-box">
    <div class="modal-head"><span id="help-title" data-i18n="help.title">使用帮助</span><button class="modal-close" data-i18n-title="ui.close" autofocus>✕</button></div>
    <div id="help-body" class="modal-body"></div>
  </div>
</dialog>

<div id="toast-container"></div>

<script src="js/i18n.js"></script>
<script src="js/engine.js"></script>
<script src="js/protocols.js"></script>
<script src="js/devices.js"></script>
<script src="js/commands.js"></script>
<script src="js/terminal.js"></script>
<script src="js/canvas.js"></script>
<script src="js/inspector.js"></script>
<script src="js/sniffer.js"></script>
<script src="js/labs.js"></script>
<script src="js/app.js"></script>
</body>
</html>
